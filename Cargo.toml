[package]
name = "mesh-onnx"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Managed ONNX OCR, transcription, similarity and depth provider for Mesh LLM"
repository = "https://github.com/Mesh-LLM/onnx"

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["multipart", "json"] }
clap = { version = "4", features = ["derive", "env"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "tiff", "webp"] }
mesh-llm-plugin = { git = "https://github.com/Mesh-LLM/mesh-llm", rev = "71a28b5830d81bf83effcf1e08d37377540cf829" }
ndarray = "0.17"
ort = { version = "=2.0.0-rc.12", features = ["ndarray"] }
unicode-normalization = "0.1"

pdfium-render = { version = "0.9", default-features = false, features = ["pdfium_7763", "image_025", "thread_safe"] }
reqwest = { version = "0.12", features = ["multipart", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
unicode-width = "0.2"
tokenizers = { version = "0.22.2", default-features = false, features = ["onig"] }
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
